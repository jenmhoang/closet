<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="items">
    <div id="backdrop" class="hidden"></div>
    <div id="page-content">
        <h2>Items</h2>
        <div class="filter-sort-buttons">
            <button id="filter-button">
                <img src="/icons/filter.svg" class="icon">
                Filter
            </button>
            <div>
                <button id="sort-button">
                    Sort By
                    <img src="/icons/sort.svg" class="icon">
                </button>
                <item-sort class="hidden"></item-sort>
            </div>
        </div>
        <item-filter class="hidden"></item-filter>
        <div id="components-list"></div>
    </div>
    <button id="add-button">
        <span id="add-icon"></span>
    </button>
    <bottom-sheet>
        <item-add slot="content"></item-add>
    </bottom-sheet>
</div>
    <nav-bar></nav-bar>
    <script src="app.js" onload="initItemsPage()"></script>
</body>
</html>
