<form class='input-form' method="dialog">
    <div class="input-options">
        <label class="search-label hidden">
            Search
            <input type="text" placeholder=" " class="search-input">
            <button class="clear-button"></button>
        </label>
        <label class="items-label">
            Items
        </label>
        <div class="items">
            <button class="add-item-button">
                Add Item
                <span class="add-icon"></span>
            </button>
        </div>
        <label>Image
            <input type="file" accept="image/*" class="image-input">
            <button class="clear-file-button hidden"></button>
        </label>
        <label>
            Weather
            <select class="weather-select"></select>
        </label>
        <label>
            Stars
            <select class="stars-select"></select>
        </label>
        <label>
            <input type="checkbox" class="available-checkbox">
            Available
        </label>
        <label class="hidden">
            <input type="checkbox" class="wishlist-checkbox">
            Wishlist
        </label>
    </div>
    <div class="input-buttons">
        <button type="reset" class="reset-button hidden">Reset</button>
        <button type="button" class="submit-button">Submit</button>
    </div>
</form>
