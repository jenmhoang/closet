<form class='input-form' method="dialog">
    <div class="input-options">
        <label class="search-label">
            Search
            <input type="text" placeholder=" " class="search-input">
            <button type="reset" class="clear-button"></button>
        </label>
        <label for="items-select">
            Items
            <select class="items-select" multiple></select>
        </label>
        <label>
            Weather
            <select class="weather-select"></select>
        </label>
        <label>
            Stars
            <select class="stars-select"></select>
        </label>
        <label>
            <input type="checkbox" class="available-checkbox">
            Available
        </label>
        <label class="hidden">
            <input type="checkbox" class="wishlist-checkbox">
            Wishlist
        </label>
    </div>
    <div class="input-buttons">
        <button type="button" class="cancel-button">Cancel</button>
        <button type="submit" class="submit-button">Submit</button>
    </div>
</form>
