<form class='input-form' method="dialog">
    <div class="input-options">
        <label for="name-input">
            Name
            <input type="text" placeholder=" " class="name-input">
            <button type="reset" class="clear-button"></button>
        </label>
        <label>
            Type
            <select class="type-select"></select>
        </label>
        <label>
            <input type="checkbox" class="wishlist-checkbox">
            Wishlist
        </label>
        <label>
            <input type="checkbox" class="worn-checkbox">
            Worn
        </label>
    </div>
    <div class="input-buttons">
        <button type="submit" class="cancel-button" formnovalidate>Cancel</button>
        <button type="submit" class="submit-button">Submit</button>
    </div>
</form>
