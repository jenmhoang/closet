<form class='input-form' method="dialog">
    <div class="input-options">
        <label>
            Name
            <input type="text" placeholder=" " class="name-input">
            <button class="clear-button"></button>
        </label>
        <label>
            Type
            <select class="type-select"></select>
        </label>
        <label>Image
            <input type="file" accept="image/*" class="image-input">
            <button class="clear-file-button hidden"></button>
        </label>
        <label>
            <input type="checkbox" class="worn-checkbox">
            Worn
        </label>
        <label>
            <input type="checkbox" class="wishlist-checkbox">
            Wishlist
        </label>
    </div>
    <div class="input-buttons">
        <button type="reset" class="reset-button hidden">Reset</button>
        <button type="button" class="submit-button">Submit</button>
    </div>
</form>
