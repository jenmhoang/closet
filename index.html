<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Closet</title>
    <link rel="canonical" href="https://jenmhoang.github.io/closet/" />
    <link rel="manifest" href="/closet/manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="outfits">
    <div id="backdrop" class="hidden"></div>
    <div id="page-content">
        <h2>Outfits</h2>
        <filter-indicator class="hidden"></filter-indicator>
        <div class="filter-sort-buttons">
            <button class="filter-button">
                <span class="icon"></span>
                Filter
            </button>
            <div>
                <button class="sort-button">
                    Sort By
                    <span class="icon"></span>
                </button>
                <sort-by params='Weather,Stars' class="sort hidden"></sort-by>
            </div>
        </div>
        <outfit-filter class="filter hidden"></outfit-filter>
        <div id="components-list"></div>
    </div>
    <button id="add-button">
        <span class="add-icon"></span>
    </button>
    <bottom-sheet></bottom-sheet>
    <nav-bar></nav-bar>
    <script src="app.js" onload="initOutfitsPage()"></script>
    <script>
        if (navigator.serviceWorker) {
            navigator.serviceWorker.register (
            'sw.js',
            {scope: '/closet/'}
            )
        }
    </script>
</body>
</html>
