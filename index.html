<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Closet</title>
    <link rel="canonical" href="https://jenmhoang.github.io/closet/" />
    <link rel="manifest" href="/closet/manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="outfits">
    <div id="header">
        <h2>Outfits</p>
    </div>
    <div id="page-content">
        <outfit-filter></outfit-filter>
        <div id="components-list"></div>
    </div>
    <button id="add-button">+</button>
    <dialog id="add-dialog">
        <h2>Add Outfit</h2>
        <outfit-add></outfit-add>
    </dialog>
    <nav-bar></nav-bar>
    <script src="app.js" onload="initOutfitsPage()"></script>
    <script>
        if (navigator.serviceWorker) {
            navigator.serviceWorker.register (
            'sw.js',
            {scope: '/closet/'}
            )
        }
    </script>
</body>
</html>
