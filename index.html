<!DOCTYPE html>
<link rel="stylesheet" href="styles.css">
<html>
<body data-page="outfits">
    <div id="header">
        <h2>Outfits</p>
    </div>
    <div id="page-content">
        <div id="components-list"></div>
    </div>
    <button id="add-button">+</button>
    <dialog id="add-dialog">
        <h2>Add Outfit</h2>
        <form method="dialog" id="add-form">
            <label for="aoitems">Items:</label>
            <select id="aoitems" multiple></select>
            <br>
            <label for="aoweather">Weather:</label>
            <select id="aoweather">
                <option disabled selected value></option>
            </select>
            <br>
            <label for="aostars">Stars:</label>
            <select id="aostars">
                <option disabled selected value></option>
            </select>
            <br>
            <div>
                <button type="submit" formnovalidate>Cancel</button>
                <button type="submit" id="add-submit">Submit</button>
            </div>
        </form>
    </dialog>
    <div id="navbar"></div>
    <script src="utils.js" onload="initOutfitsPage()"></script>
</body>
</html>
